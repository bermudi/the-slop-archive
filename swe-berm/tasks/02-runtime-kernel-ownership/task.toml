schema_version = "1.3"
artifacts = []

[task]
name = "bermudi/runtime-kernel-ownership"
description = "Move Conversation runtime ownership out of the Telegram adapter: a concrete ConversationRuntimeHost owns Surface-backed runtime state, composition happens before Telegram intake, and the orchestration import cycle is removed."
authors = [{ name = "bermudi", email = "github.igizp@dabg.uk" }]
keywords = ["typescript", "bun", "refactor", "ownership", "architecture", "stabilization"]

[metadata]
base_commit = "1340493861848583e29aa0b734ba120de09b77dd"
base_repo = "little-goblin"
# Base = the COMMITTED tree @ 1340493 only. The 2026-08-09 "dependency map
# panning" session's uncommitted edits (ARCHITECTURE.md + BACKLOG.md plan
# records, README.md row, comparison.html) are excluded: they spell out the
# accepted runtime-kernel cycle and ARE the task's gold prose. The graded
# patch is that cycle (session event 84's "exact cut"), implementation TBD.
base_curation = "1340493 committed tree; session doc edits excluded (prose gold)"
solution_commit = "TBD — reference implementation not yet authored (task in groundwork)"
session = "~/.pi/agent/sessions/--home-daniel-build-little-goblin--/2026-08-09T03-06-20-626Z_019fe47c-5252-7265-8976-88e31b990d22.jsonl"

[environment]

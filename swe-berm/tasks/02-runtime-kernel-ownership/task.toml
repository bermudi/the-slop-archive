schema_version = "1.3"
artifacts = []

[task]
name = "bermudi/runtime-kernel-ownership"
description = "Move Conversation runtime ownership out of the Telegram adapter: a concrete ConversationRuntimeHost owns Surface-backed runtime state, composition happens before Telegram intake, and the orchestration import cycle is removed."
authors = [{ name = "bermudi", email = "github.igizp@dabg.uk" }]
keywords = ["typescript", "bun", "refactor", "ownership", "architecture", "stabilization"]

[metadata]
base_commit = "1340493861848583e29aa0b734ba120de09b77dd"
base_repo = "little-goblin"
# Base = the COMMITTED tree @ 1340493 only. The 2026-08-09 "dependency map
# panning" session's uncommitted edits (ARCHITECTURE.md + BACKLOG.md plan
# records, README.md row, comparison.html) are excluded: they spell out the
# accepted runtime-kernel cycle and ARE the task's gold prose. The graded
# patch is that cycle (session event 84's "exact cut"), implemented and
# review-hardened in the single commit below. Its successor aa3803a begins
# the explicitly out-of-scope PreparedRuntimeAssembler capability.
base_curation = "1340493 committed tree; session doc edits excluded (prose gold)"
solution_commit = "1c8420b4a50d1f1fd6df90f4147ff3e962fba8e9"
session = "~/.pi/agent/sessions/--home-daniel-build-little-goblin--/2026-08-09T03-06-20-626Z_019fe47c-5252-7265-8976-88e31b990d22.jsonl"

[environment]
# image: oven/bun:1.3.7 — see environment/Dockerfile. 1.2.x cannot run the
# base suite (vi.useFakeTimers missing; coalesce tests double-run+fail).
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]

[verifier]
timeout_sec = 900.0
network_mode = "no-network"
environment_mode = "separate"

[verifier.env]

[verifier.environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
os = "linux"
network_mode = "no-network"

[[verifier.collect]]
command = """
set -e
mkdir -p /logs/artifacts
cd /app
# base tag created in environment Dockerfile
if git rev-parse --verify base >/dev/null 2>&1; then BASE=base; else BASE=HEAD; fi
# Stage the final non-ignored worktree so new files are included even when
# the agent did not explicitly git add or commit them. One base-to-final diff
# is coherent and captures committed, staged, and unstaged changes together.
git add -A
git diff --binary "$BASE" -- > /logs/artifacts/model.patch
# ensure file exists even if empty
touch /logs/artifacts/model.patch
"""
timeout_sec = 30.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[solution]
# reference solution is the working tree at task completion; never used at grading

[solution.env]
